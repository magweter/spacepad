# Accepted vulnerabilities — blocking gate only.
#
# This file is passed ONLY to the gating step in .github/workflows/security.yml. The
# reporting step runs without it, so everything listed here still shows up in full in the
# GitHub Security tab. Nothing is hidden; these are only prevented from failing the build.
#
# Every entry below is a build-time dependency of the Vite asset pipeline
# (backend/pnpm-lock.yaml). They run inside the `node_builder` stage of backend/Dockerfile
# and are never present in the runtime image, which only receives the compiled assets.
# That makes them real-but-low-exposure: worth fixing, not worth blocking every PR over
# before the first Renovate batch has landed.
#
# All of them have a fix available. Renovate raises vulnerability PRs outside its normal
# schedule, so these should be resolved within days of it being installed.
#
# `expiredAt` is a deliberate forcing function: once the date passes, the entry stops
# applying and the build goes red again. Do not extend the dates without a reason —
# bump the packages instead, then delete the entry.

vulnerabilities:
  # --- tar (transitive, via the pnpm/vite toolchain) — fixed in 7.5.19+ -----------------
  - id: CVE-2026-59873 # CRITICAL
    paths:
      - "backend/pnpm-lock.yaml"
    statement: "Build-time only (Vite asset pipeline); not in the runtime image. Fixed by upgrading tar to >= 7.5.19."
    expiredAt: 2026-09-01
