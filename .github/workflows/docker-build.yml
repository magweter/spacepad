name: Build and Push Docker Image

on:
  push:
    branches:
      - main
      - dev
    tags:
      - 'v*'
    paths:
      - 'backend/**'
      - '.github/workflows/docker-build.yml'
  schedule:
    # Monday 04:17 UTC, two hours before the weekly image scan in security.yml. Rebuilds
    # :dev and the latest release (:latest, :stable and its version tags) so the scan sees
    # this week's Debian security fixes instead of whatever was current at the last push
    # or release.
    - cron: '17 4 * * 1'
  workflow_dispatch:
    inputs:
      rebuild_release:
        description: 'Rebuild the latest v* release with current Debian packages instead of building the selected ref'
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    if: ${{ !inputs.rebuild_release }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      # A scheduled run starts on the default branch; the image the security scan checks
      # is :dev, so build that instead.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'schedule' && 'dev' || '' }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          driver: docker-container

      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # On a scheduled run, take ref and sha from the checkout rather than the triggering
          # event, so the build of dev is tagged as dev and not as the default branch.
          context: ${{ github.event_name == 'schedule' && 'git' || 'workflow' }}
          tags: |
            # latest and stable only on version tags — never on raw branch commits
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=stable,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            # For dev branch
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' || github.event_name == 'schedule' }}
            # For version tags: v1.7.0 → image tags 1.7.0 and 1.7
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # Common tags
            type=ref,event=branch
            type=sha,format=short

      - name: Determine version
        id: version
        # Ref values are passed through env rather than interpolated into the script:
        # a `${{ }}` expression inside `run:` is substituted before the shell sees it, so a
        # crafted ref name would be executed as shell. Flagged by Semgrep as
        # github-actions.security.run-shell-injection.
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$REF_TYPE" == "tag" ]]; then
            # Strip leading 'v' so the app displays "1.7.0" not "v1.7.0"
            echo "git_tag=${REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "git_commit=" >> "$GITHUB_OUTPUT"
          else
            echo "git_tag=" >> "$GITHUB_OUTPUT"
            # Short SHA of what was checked out, which differs from GITHUB_SHA on a
            # scheduled run
            echo "git_commit=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          fi
          # Changes daily, which invalidates the cached apt-get upgrade layer once a day.
          # Without it the GHA layer cache keeps replaying the upgrade from the first build
          # and the image never picks up new Debian security fixes.
          echo "apt_refresh=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_TAG=${{ steps.version.outputs.git_tag }}
            GIT_COMMIT=${{ steps.version.outputs.git_commit }}
            APT_REFRESH=${{ steps.version.outputs.apt_refresh }}
          # Own cache scope, so the release rebuild below does not evict the layers of dev.
          cache-from: type=gha,scope=dev
          cache-to: type=gha,mode=max,scope=dev

  # :latest is otherwise only built when a v* tag is pushed, so between releases it keeps
  # the Debian packages of release day and the weekly image scan goes red on fixes that
  # were published since. Rebuild the newest release from its own tag every week: same
  # code, same version string, current packages. Nothing from dev ends up in :latest.
  rebuild-release:
    if: ${{ github.event_name == 'schedule' || inputs.rebuild_release }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Find the latest release
        id: release
        # Final releases only (v1.9.1, not v1.10.0-beta.1), highest version first.
        run: |
          tag=$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)
          if [[ -z "$tag" ]]; then
            echo "No release tag found" >&2
            exit 1
          fi
          version="${tag#v}"
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "minor=${version%.*}"
            echo "apt_refresh=$(date -u +%F)"
          } >> "$GITHUB_OUTPUT"
          echo "Rebuilding $tag"

      - name: Check out the release
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: git checkout --quiet "refs/tags/$RELEASE_TAG"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          driver: docker-container

      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The same tags a release push produces, minus the commit sha.
      - name: Rebuild and push the release image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:stable
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.release.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.release.outputs.minor }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
          build-args: |
            GIT_TAG=${{ steps.release.outputs.version }}
            GIT_COMMIT=
            APT_REFRESH=${{ steps.release.outputs.apt_refresh }}
          cache-from: type=gha,scope=release
          cache-to: type=gha,mode=max,scope=release
